<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kumite Pad">
<meta name="theme-color" content="#0f0a0e">
<link rel="apple-touch-icon" href="assets/icon-180.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png?v=2">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png?v=2">
<title>Kumite Controller</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  /* Kumite phone controller. Sized from the visible screen (JS sets --vw/--vh), so it fits with Safari's bars showing.
     Layout: a stick on the left, four face buttons in a diamond on the right, a slim status bar on top. */
  :root {
    --bg: #0f0a0e; --bg2: #1d131a; --line: rgba(246, 237, 220, 0.10); --paper: #f6eddc; --dim: rgba(246, 237, 220, 0.55);
    --red: #e3412f; --gold: #f2c14e; --teal: #3fc2b4; --blue: #4d8de6; --p1: #4d8de6; --p2: #e3412f;
    --display: "Dela Gothic One", "Arial Black", Impact, sans-serif; --ui: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
    --vw: 100vw; --vh: 100vh; --u: 1px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--paper); overflow: hidden; overscroll-behavior: none; touch-action: none; font-family: var(--ui); }
  #app { position: fixed; left: 0; top: 0; width: var(--vw); height: var(--vh);
         padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
         display: grid; grid-template-rows: auto 1fr;
         background: radial-gradient(ellipse at 25% 60%, #24171f 0%, transparent 55%), radial-gradient(ellipse at 78% 55%, #24171f 0%, transparent 55%), linear-gradient(180deg, var(--bg2), var(--bg)); }

  /* status bar */
  header { display: flex; align-items: center; gap: 10px; padding: calc(var(--u) * 2.2) calc(var(--u) * 4); min-height: 0; }
  #tag { font-family: var(--display); font-size: calc(var(--u) * 5); letter-spacing: 0.04em; padding: calc(var(--u) * 0.6) calc(var(--u) * 3); border-radius: 999px; background: #2a1f26; color: var(--dim); white-space: nowrap; }
  #tag.p1 { background: var(--p1); color: #fff; } #tag.p2 { background: var(--p2); color: #fff; }
  #dot { width: calc(var(--u) * 2.4); height: calc(var(--u) * 2.4); border-radius: 50%; background: #6a5a62; flex: none; }
  #dot.ok { background: #5fd88a; box-shadow: 0 0 calc(var(--u) * 2) #5fd88a; }
  #msg { flex: 1; min-width: 0; font-size: calc(var(--u) * 4); font-weight: 600; letter-spacing: 0.06em; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pause { flex: none; width: calc(var(--u) * 15); height: calc(var(--u) * 9); border-radius: calc(var(--u) * 3); border: 0; background: #2a1f26; color: var(--paper);
           font-family: var(--ui); font-weight: 800; font-size: calc(var(--u) * 4); letter-spacing: 0.1em; box-shadow: inset 0 -2px 0 rgba(0,0,0,0.4); }
  #pause.on { background: var(--paper); color: var(--bg); }

  main { position: relative; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  .zone { position: relative; min-width: 0; min-height: 0; }

  main { position: relative; min-height: 0; }

  /* stick: flat rings, no gradients */
  #base { position: absolute; width: calc(var(--S) * 0.62 * var(--k)); height: calc(var(--S) * 0.62 * var(--k)); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none;
          background: rgba(0,0,0,0.35); border: calc(var(--u) * 1.2) solid #c9a86a; opacity: 0.55; transition: opacity 0.15s; }
  #base.live { opacity: 1; }
  #base::before { content: ""; position: absolute; inset: 18%; border-radius: 50%; border: 1px dashed rgba(246, 237, 220, 0.22); }
  #knob { position: absolute; width: calc(var(--S) * 0.30 * var(--k)); height: calc(var(--S) * 0.30 * var(--k)); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none;
          background: #e9dcc4; border-bottom: calc(var(--u) * 1.4) solid #a8977b; }
  #hintL { position: absolute; transform: translate(-50%, 0); font-size: calc(var(--u) * 3.6); letter-spacing: 0.18em; color: var(--dim); pointer-events: none; white-space: nowrap; }

  /* face buttons: flat colour, a solid lip underneath that disappears when pressed */
  .b { position: absolute; width: var(--d); height: var(--d); border-radius: 50%; transform: translate(-50%, -50%); background: var(--c);
       border-bottom: calc(var(--d) * 0.06) solid color-mix(in srgb, var(--c) 55%, #000);
       display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform 0.05s; z-index: 2; }
  .b span { font-family: var(--display); font-size: calc(var(--d) * 0.36); line-height: 1; color: #fff; }
  .b small { font-weight: 800; font-size: calc(var(--d) * 0.15); letter-spacing: 0.12em; color: rgba(255,255,255,0.9); margin-top: 2%; }
  .b.on { transform: translate(-50%, -47%) scale(0.94); border-bottom-width: 0; filter: brightness(1.18); }
  .b.a0 { --c: var(--red); } .b.a1 { --c: #d9a21f; } .b.a2 { --c: #26a596; } .b.a3 { --c: var(--blue); }
  .b.a3 span { font-family: var(--ui); font-weight: 800; }

  /* layout editor */
  #edit { flex: none; height: calc(var(--u) * 9); padding: 0 calc(var(--u) * 3); border-radius: calc(var(--u) * 3); border: 0; background: #2a1f26; color: var(--paper);
          font-family: var(--ui); font-weight: 800; font-size: calc(var(--u) * 4); letter-spacing: 0.1em; }
  #bar { position: absolute; left: 50%; bottom: calc(var(--u) * 2); transform: translateX(-50%); display: none; gap: 8px; align-items: center; z-index: 5;
         background: #2a1f26; border-radius: 14px; padding: 8px 10px; font-size: 14px; letter-spacing: 0.04em; white-space: nowrap; }
  #bar button { border: 0; border-radius: 10px; background: #43343d; color: var(--paper); font: 800 15px/1 var(--ui); letter-spacing: 0.08em; padding: 10px 12px; }
  #bar button.go { background: var(--red); color: #fff; }
  #bar em { font-style: normal; color: var(--dim); }
  main.edit #bar { display: flex; }
  main.edit .b, main.edit #base { outline: 2px dashed rgba(246,237,220,0.6); outline-offset: 4px; opacity: 1; }
  main.edit #base { pointer-events: auto; }
  main.edit #hintL { opacity: 0 !important; }

  /* overlays */
  .sheet { position: fixed; inset: 0; background: rgba(15, 10, 14, 0.96); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; text-align: center; font-size: 18px; }
  .sheet.on { display: flex; }
  .sheet h1 { font-family: var(--display); font-weight: 400; font-size: 28px; margin: 0; letter-spacing: 0.04em; }
  .sheet p { margin: 0; color: var(--dim); max-width: 420px; line-height: 1.35; }
  .sheet input { font: 400 28px/1 var(--display); letter-spacing: 6px; text-transform: uppercase; width: 220px; max-width: 100%; text-align: center; padding: 10px; border-radius: 12px; border: 2px solid var(--paper); background: transparent; color: var(--paper); -webkit-user-select: text; user-select: text; }
  .sheet button { font: 800 18px/1 var(--ui); letter-spacing: 0.1em; padding: 14px 30px; border-radius: 12px; border: 0; background: var(--red); color: #fff; }
  #tip { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 6px); transform: translateX(-50%); display: none; gap: 10px; align-items: center;
         background: #2a1f26; color: var(--paper); border-radius: 999px; padding: 8px 8px 8px 16px; font-size: 14px; letter-spacing: 0.04em; box-shadow: 0 6px 18px rgba(0,0,0,0.5); max-width: calc(100vw - 24px); }
  #tip.on { display: flex; }
  #tip button { border: 0; border-radius: 999px; background: var(--paper); color: var(--bg); font: 800 13px/1 var(--ui); letter-spacing: 0.08em; padding: 8px 12px; }
  @media (prefers-reduced-motion: reduce) { .b, #base { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <header><div id="tag">KUMITE</div><div id="dot"></div><div id="msg">Connecting…</div><button id="edit" aria-label="Edit layout">LAYOUT</button><button id="pause" aria-label="Pause">PAUSE</button></header>
  <main id="main">
    <div id="base"></div><div id="knob"></div><div id="hintL">MOVE</div>
    <div class="b" id="b0"><span></span><small></small></div>
    <div class="b" id="b1"><span></span><small></small></div>
    <div class="b" id="b2"><span></span><small></small></div>
    <div class="b" id="b3"><span></span><small></small></div>
    <div id="bar"><em>Drag to move · tap a button to change it</em><button id="sm" aria-label="Smaller">−</button><button id="bg" aria-label="Bigger">+</button><button id="rs">RESET</button><button id="done" class="go">DONE</button></div>
  </main>
</div>
<div class="sheet" id="join"><h1>KUMITE</h1><p>Enter the code shown on the game screen.</p><input id="code" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="PD…"><button id="go">CONNECT</button></div>
<div class="sheet" id="turn"><h1>TURN SIDEWAYS</h1><p>Hold your phone in landscape, like a controller.</p></div>
<div id="tip"><span id="tipT">Full screen: tap Share, then Add to Home Screen</span><button id="tipGo" hidden>INSTALL</button><button id="tipOk">OK</button></div>
<script>
'use strict';
(function () {
  const $ = (id) => document.getElementById(id), root = document.documentElement;
  const st = { mx: 0, mz: 0, b: [false, false, false, false, false] };
  let ws = null, myId = null, slot = null, code = (new URLSearchParams(location.search).get('c') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  try { if (code) localStorage.setItem('kumitePadCode', code); else code = localStorage.getItem('kumitePadCode') || ''; } catch (e) { /* storage blocked */ }
  let lastSent = '', lastAt = 0, retry = null, noGame = null;

  // ---- layout: where the stick rests and where each button sits (fractions of the play area), what each
  // button does, and a size. The player can change all of it (LAYOUT) and it is kept on this phone.
  const ACT = [['J', 'PUSH'], ['K', 'GRAB'], ['L', 'DASH'], ['★', 'SKILL']];
  const main = $('main'), base = $('base'), knob = $('knob'), btns = [0, 1, 2, 3].map((i) => $('b' + i));
  let L = null, sticking = false, area = { w: 1, h: 1 };
  function defaults() {
    // stick in the middle of the left half; buttons in a diamond in the middle of the right half
    const s = Math.min(area.w / 2, area.h), off = s * 0.30, cx = area.w * 0.75, cy = area.h / 2;
    const f = (x, y) => [x / area.w, y / area.h];
    return { k: 1, stick: [0.25, 0.5], b: [f(cx, cy + off).concat(0), f(cx + off, cy).concat(1), f(cx - off, cy).concat(2), f(cx, cy - off).concat(3)] };
  }
  function loadLayout() { try { const j = JSON.parse(localStorage.getItem('kumitePadLayout')); if (j && j.b && j.b.length === 4 && j.stick) return j; } catch (e) { /* none saved */ } return null; }
  function saveLayout() { try { localStorage.setItem('kumitePadLayout', JSON.stringify(L)); } catch (e) { /* storage blocked */ } }
  function drawButtons() {
    const s = Math.min(area.w / 2, area.h);
    main.style.setProperty('--d', (s * 0.30 * L.k) + 'px'); root.style.setProperty('--k', L.k);
    btns.forEach((el, i) => {
      const [fx, fy, a] = L.b[i]; el.className = 'b a' + a + (st.b[a] && el.dataset.on ? ' on' : '');
      el.style.left = (fx * area.w) + 'px'; el.style.top = (fy * area.h) + 'px';
      el.querySelector('span').textContent = ACT[a][0]; el.querySelector('small').textContent = ACT[a][1];
    });
    const hx = L.stick[0] * area.w, hy = L.stick[1] * area.h;
    if (!sticking) placeBase(hx, hy);
    const h = $('hintL'); h.style.left = hx + 'px'; h.style.top = Math.min(area.h - 20, hy + base.offsetHeight / 2 + 6) + 'px';
  }

  // ---- fit everything to the part of the screen that is actually visible (ignoring any zoom)
  function layout() {
    const vv = window.visualViewport, z = vv && Math.abs(vv.scale - 1) < 0.01;
    const w = Math.round(z ? vv.width : document.documentElement.clientWidth), h = Math.round(z ? vv.height : innerHeight);
    root.style.setProperty('--vw', w + 'px'); root.style.setProperty('--vh', h + 'px');
    const u = Math.max(4, Math.min(w, h * 1.6) / 100) * 0.62; // scale unit for the bar and small text
    root.style.setProperty('--u', u.toFixed(2) + 'px');
    $('turn').classList.toggle('on', h > w * 1.1 && !$('join').classList.contains('on'));
    requestAnimationFrame(() => {
      const r = main.getBoundingClientRect(); area = { w: r.width, h: r.height };
      root.style.setProperty('--S', Math.min(r.width / 2, r.height) + 'px');
      if (!L) L = loadLayout() || defaults();
      drawButtons();
    });
  }
  window.addEventListener('resize', layout);
  if (window.visualViewport) visualViewport.addEventListener('resize', layout);
  window.scrollTo(0, 0);

  // ---- connection
  // this phone's key, kept on the phone so a reconnect gets the same player seat back
  let pk = ''; try { pk = localStorage.getItem('kumitePk') || ''; } catch (e) { /* ignore */ }
  if (!pk) { pk = Math.random().toString(36).slice(2, 10); try { localStorage.setItem('kumitePk', pk); } catch (e) { /* ignore */ } }
  function msg(t) { $('msg').textContent = t; }
  function connect() {
    if (!code) { $('join').classList.add('on'); layout(); return; }
    $('join').classList.remove('on');
    const u = new URL('ws', location.href); u.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:'; u.search = '?room=' + code; u.hash = '';
    try { ws = new WebSocket(u.toString()); } catch (e) { msg('Could not reach the game'); return; }
    msg('Connecting…');
    ws.onopen = () => {
      ws.send(JSON.stringify({ t: 'hi', pk }));
      clearTimeout(noGame); noGame = setTimeout(() => { if (slot === null) msg('Waiting for the game: open PHONE CONTROLLERS on it'); }, 3000);
    };
    ws.onmessage = (e) => {
      if (e.data === 'pong') return;
      let m; try { m = JSON.parse(e.data); } catch (er) { return; }
      if (m.t === 'full') { msg('Both player spots are taken'); return; }
      if (m.t === 'you') myId = m.id;
      if (m.t === 'slot' && m.to === myId) {
        slot = m.slot;
        if (slot < 0) { msg('Both player spots are taken'); $('tag').textContent = 'KUMITE'; $('tag').className = ''; $('dot').className = ''; return; }
        $('tag').textContent = 'PLAYER ' + (slot + 1); $('tag').className = 'p' + (slot + 1); $('dot').className = 'ok';
        msg('Connected · in menus J is OK, K is back');
        send(true);
      }
    };
    ws.onclose = () => { slot = null; $('dot').className = ''; msg('Reconnecting…'); clearTimeout(retry); retry = setTimeout(connect, 2000); };
    ws.onerror = () => {};
  }
  // send stick and buttons when they change, plus a heartbeat so the game knows we're still here
  function send(force) {
    if (!ws || ws.readyState !== 1 || slot === null || slot < 0) return;
    const s = JSON.stringify({ t: 'st', mx: Math.round(st.mx * 100) / 100, mz: Math.round(st.mz * 100) / 100, b: st.b.map((x) => (x ? 1 : 0)), pk });
    const now = performance.now();
    if (!force && s === lastSent && now - lastAt < 250) return;
    ws.send(s); lastSent = s; lastAt = now;
  }
  setInterval(() => send(false), 100);
  setInterval(() => { if (ws && ws.readyState === 1) ws.send('ping'); }, 20000);
  const buzz = (ms) => { if (navigator.vibrate) navigator.vibrate(ms); };

  // ---- stick: rests at its home spot; touch anywhere on that side of the screen and it jumps under your thumb
  let sid = null, ox = 0, oy = 0;
  function placeBase(x, y) { ox = x; oy = y; base.style.left = knob.style.left = x + 'px'; base.style.top = knob.style.top = y + 'px'; }
  const rel = (e) => { const r = main.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  main.addEventListener('pointerdown', (e) => {
    if (editing || sid !== null || e.target.closest('.b,#bar')) return;
    const [x, y] = rel(e);
    if ((x < area.w / 2) !== (L.stick[0] < 0.5)) return; // the other half belongs to the buttons
    sid = e.pointerId; main.setPointerCapture(sid); sticking = true; placeBase(x, y);
    base.classList.add('live'); $('hintL').style.opacity = 0; wake();
  });
  main.addEventListener('pointermove', (e) => {
    if (e.pointerId !== sid) return;
    const [x, y] = rel(e), R = base.offsetWidth * 0.36;
    let dx = x - ox, dy = y - oy;
    const l = Math.hypot(dx, dy); if (l > R) { dx *= R / l; dy *= R / l; }
    knob.style.left = (ox + dx) + 'px'; knob.style.top = (oy + dy) + 'px';
    let mx = dx / R, mz = dy / R; if (Math.hypot(mx, mz) < 0.2) { mx = 0; mz = 0; }
    st.mx = mx; st.mz = mz; send(false);
  });
  const endStick = (e) => {
    if (e.pointerId !== sid) return; sid = null; sticking = false; st.mx = 0; st.mz = 0;
    base.classList.remove('live'); placeBase(L.stick[0] * area.w, L.stick[1] * area.h); send(true);
  };
  main.addEventListener('pointerup', endStick); main.addEventListener('pointercancel', endStick);

  // ---- face buttons: each finger can hold its own
  btns.forEach((el, i) => {
    el.addEventListener('pointerdown', (e) => {
      el.setPointerCapture(e.pointerId);
      if (editing) { drag = { i, x0: e.clientX, y0: e.clientY, moved: false }; return; }
      const a = L.b[i][2]; st.b[a] = true; el.dataset.on = 1; el.classList.add('on'); buzz(10); send(true); wake();
    });
    const up = () => { if (editing) return; const a = L.b[i][2]; st.b[a] = false; delete el.dataset.on; el.classList.remove('on'); send(true); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  });

  // ---- layout editor: drag the stick or a button, tap a button to change what it does, resize, reset
  let editing = false, drag = null;
  base.addEventListener('pointerdown', (e) => { if (!editing) return; base.setPointerCapture(e.pointerId); drag = { i: -1, x0: e.clientX, y0: e.clientY, moved: false }; });
  document.addEventListener('pointermove', (e) => {
    if (!drag) return;
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 8) drag.moved = true;
    if (!drag.moved) return;
    const [x, y] = rel(e), fx = Math.max(0.06, Math.min(0.94, x / area.w)), fy = Math.max(0.08, Math.min(0.92, y / area.h));
    if (drag.i < 0) L.stick = [fx, fy]; else { L.b[drag.i][0] = fx; L.b[drag.i][1] = fy; }
    drawButtons();
  });
  document.addEventListener('pointerup', () => {
    if (!drag) return;
    if (!drag.moved && drag.i >= 0) { const b = L.b[drag.i]; b[2] = (b[2] + 1) % 4; buzz(10); } // tap: next action
    drag = null; drawButtons(); saveLayout();
  });
  function setEdit(on) {
    editing = on; main.classList.toggle('edit', on); $('edit').classList.toggle('on', on);
    st.mx = 0; st.mz = 0; st.b = [false, false, false, false, st.b[4]]; send(true); drawButtons();
  }
  $('edit').addEventListener('click', () => setEdit(!editing));
  $('done').addEventListener('click', () => { saveLayout(); setEdit(false); });
  $('rs').addEventListener('click', () => { L = defaults(); saveLayout(); drawButtons(); });
  $('sm').addEventListener('click', () => { L.k = Math.max(0.7, +(L.k - 0.1).toFixed(2)); saveLayout(); drawButtons(); });
  $('bg').addEventListener('click', () => { L.k = Math.min(1.5, +(L.k + 0.1).toFixed(2)); saveLayout(); drawButtons(); });
  const pz = $('pause');
  pz.addEventListener('pointerdown', () => { st.b[4] = true; pz.classList.add('on'); buzz(10); send(true); });
  const pzUp = () => { st.b[4] = false; pz.classList.remove('on'); send(true); };
  pz.addEventListener('pointerup', pzUp); pz.addEventListener('pointercancel', pzUp);

  // ---- keep the screen awake while playing (where the phone allows it)
  let lock = null;
  function wake() { if (lock || !navigator.wakeLock) return; navigator.wakeLock.request('screen').then((l) => { lock = l; l.addEventListener('release', () => { lock = null; }); }).catch(() => {}); }
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('gesturestart', (e) => e.preventDefault()); // no pinch zoom on iPhone
  // no double-tap zoom, no magnifier, no scrolling: the page swallows raw touches (pointer events still arrive)
  const free = (e) => e.target.closest && e.target.closest('input, .sheet button, #tip button, #bar button, #edit');
  for (const t of ['touchstart', 'touchmove', 'touchend']) document.addEventListener(t, (e) => { if (!free(e)) e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', (e) => e.preventDefault());

  // ---- install tip. A home-screen icon opens full screen with no browser bars. Android/Chrome can install it
  // in one tap; on iPhone only the person can do it (Share, then Add to Home Screen), so we just explain how.
  // The icon remembers this phone's code, so it reconnects to the same computer next time.
  let standalone = false, seen = false;
  try { standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches; seen = !!localStorage.getItem('kumitePadTip'); } catch (e) { /* storage blocked */ }
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!ios) { const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'pad.webmanifest'; document.head.appendChild(l); }
  if (ios && !standalone && !seen) $('tip').classList.add('on');
  let ask = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); ask = e; if (seen) return;
    $('tipT').textContent = 'Install the controller: full screen, one tap to open'; $('tipGo').hidden = false; $('tip').classList.add('on');
  });
  $('tipGo').addEventListener('click', () => { if (ask) { ask.prompt(); ask = null; } $('tip').classList.remove('on'); });
  $('tipOk').addEventListener('click', () => { $('tip').classList.remove('on'); try { localStorage.setItem('kumitePadTip', '1'); } catch (e) { /* ignore */ } });

  $('go').addEventListener('click', () => { code = $('code').value.toUpperCase().replace(/[^A-Z0-9]/g, ''); if (code) connect(); });
  layout(); connect();
})();
</script>
</body>

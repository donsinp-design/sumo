# Sends a signed build of the iPhone / iPad / Mac app to TestFlight (then you submit it in App Store Connect).
# Run it by hand from the Actions tab. It needs these repository secrets (Settings > Secrets > Actions):
#   APPLE_TEAM_ID       your 10-character Apple Developer Team ID
#   ASC_KEY_ID          App Store Connect API key ID          (App Store Connect > Users and Access > Integrations)
#   ASC_ISSUER_ID       that page's Issuer ID
#   ASC_KEY_P8_BASE64   the downloaded AuthKey_XXXX.p8 file, base64-encoded
# The app record (bundle ID com.looktwicestudio.kumite) must exist in App Store Connect first.
name: iOS release

on:
  push:
    tags: ['ios-*']   # a tag like ios-1 also runs it; the number after ios- is the build number
  workflow_dispatch:
    inputs:
      build:
        description: Build number (must go up every upload)
        required: true
        default: '1'

jobs:
  testflight:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run sync:ios
      - name: Archive and upload
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/keys && echo "$KEY_P8" | base64 --decode > ~/keys/AuthKey.p8
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $HOME/keys/AuthKey.p8 -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Kumite.xcarchive DEVELOPMENT_TEAM=$TEAM CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.event.inputs.build || github.run_number }} $AUTH archive
          cat > export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Kumite.xcarchive -exportOptionsPlist export.plist -exportPath build/export $AUTH

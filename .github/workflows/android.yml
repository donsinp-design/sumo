# Builds the Android app. Every run makes Kumite-debug.apk (install it on any Android phone to test)
# and Kumite.aab (the file Google Play wants). The .aab is signed for Play when these repository
# secrets exist: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
name: Android build

on:  # manual only (Run workflow button): macOS/Windows runners eat the free minutes 10x/2x
  workflow_dispatch:
    inputs:
      build:
        description: Version code (must go up for every Google Play upload)
        required: false
        default: '1'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run sync:android
      - name: Build
        shell: bash
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VCODE: ${{ github.event.inputs.build || '1' }}
        run: |
          cd android
          SIGN=""
          if [ -n "$KS" ]; then
            echo "$KS" | base64 --decode > "$RUNNER_TEMP/kumite.jks"
            SIGN="-Pandroid.injected.signing.store.file=$RUNNER_TEMP/kumite.jks -Pandroid.injected.signing.store.password=$KS_PASS -Pandroid.injected.signing.key.alias=$KEY_ALIAS -Pandroid.injected.signing.key.password=$KEY_PASS"
          else
            echo "::notice::No signing secrets: Kumite.aab is unsigned (fine for testing, not for Google Play)"
          fi
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease -PversionCode=$VCODE $SIGN
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk ../out/Kumite-debug.apk
          cp app/build/outputs/bundle/release/app-release.aab ../out/Kumite.aab
      - uses: actions/upload-artifact@v4
        with:
          name: Kumite-Android
          path: mobile/out/*

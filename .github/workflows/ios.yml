# Builds the iPhone / iPad app (it also runs on Apple-silicon Macs) and checks it starts:
# compiles for the iOS Simulator, launches it on an iPhone and an iPad, and saves screenshots
# under "Artifacts" on the run's page. No Apple account is needed for this check.
# To send a build to TestFlight / the App Store, use the "iOS release" workflow (needs Apple secrets).
name: iOS build check

on:
  push:
    branches: [main, claude/chicken-self-steer]
    paths: ['public/**', 'apple/**', '.github/workflows/ios.yml']
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run sync
      - name: Build for the simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 && code=0 || code=$?
          grep -E "error:|\*\* BUILD" build.log | sort -u | head -n 15 | while read -r l; do echo "::warning::$l"; done
          [ $code -eq 0 ] || { echo "::error::Xcode build failed"; tail -n 40 build.log; exit 1; }
          test -f build/Build/Products/Debug-iphonesimulator/App.app/Info.plist || { echo "::error::app has no Info.plist"; exit 1; }
      - name: Launch on iPhone and iPad, take screenshots
        shell: bash
        run: |
          set +e
          mkdir -p shots
          note() { echo "::warning::$1"; }   # shows up on the run page as a note
          run() { out=$("$@" 2>&1); c=$?; [ $c -ne 0 ] && note "$* -> exit $c: $(echo "$out" | tail -n 3 | tr '\n' ' ')"; return 0; }
          xcrun simctl list runtimes | tail -n 5
          APP=build/Build/Products/Debug-iphonesimulator/App.app
          note "app contents: $(ls $APP | head -n 12 | tr '\n' ' ')"
          note "app plist: $(plutil -p $APP/Info.plist 2>&1 | grep -E 'CFBundle(Identifier|Executable|Name)' | tr '\n' ' ')"
          for kind in iPhone iPad; do
            id=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];r=[(k,x) for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('$kind')];r.sort(key=lambda t:t[0]);print(r[-1][1]['udid']+' '+r[-1][1]['name'] if r else '')")
            note "$kind simulator: ${id:-none found}"; [ -z "$id" ] && continue
            id=${id%% *}
            run xcrun simctl boot "$id"
            run xcrun simctl bootstatus "$id" -b
            run xcrun simctl install "$id" build/Build/Products/Debug-iphonesimulator/App.app
            run xcrun simctl launch "$id" com.looktwicestudio.kumite
            sleep 30
            run xcrun simctl io "$id" screenshot "shots/$kind.png"
            # a small copy as a run note, so it can be checked without downloading
            sips -Z 360 -s format jpeg -s formatOptions 45 "shots/$kind.png" --out "shots/$kind-small.jpg" >/dev/null 2>&1 && echo "::notice title=shot-$kind::$(base64 -i shots/$kind-small.jpg | tr -d '\n')"
            run xcrun simctl shutdown "$id"
          done
          ls shots/*.png >/dev/null 2>&1 || { echo "::error::no screenshots taken"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-simulator-screenshots
          path: apple/shots/*.png
